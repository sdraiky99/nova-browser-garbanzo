// Nova autoconfig. La primera linea debe ser un comentario.
// Se ejecuta con privilegios al arrancar el navegador.
try {
  const { classes: Cc, interfaces: Ci } = Components;

  // 1) Carpeta "nova" junto al ejecutable -> resource://nova/
  const gre = Services.dirsvc.get("GreD", Ci.nsIFile);
  const dir = gre.clone(); dir.append("nova");
  const fileURI = Services.io.newFileURI(dir);
  Services.io.getProtocolHandler("resource")
    .QueryInterface(Ci.nsIResProtocolHandler)
    .setSubstitution("nova", fileURI);

  // 2) Preferencias por defecto (el usuario puede cambiarlas)
  defaultPref("startup.homepage_welcome_url", "resource://nova/web/welcome.html");
  defaultPref("startup.homepage_welcome_url.additional", "");
  defaultPref("browser.startup.homepage", "resource://nova/web/newtab.html");
  defaultPref("browser.newtabpage.enabled", true);
  defaultPref("widget.windows.mica", true);              // efecto Aero/Mica en Windows 11
  defaultPref("widget.windows.mica.popups", true);
  defaultPref("browser.tabs.tabmanager.enabled", true);
  defaultPref("browser.translations.automaticallyPopup", false);
  defaultPref("browser.shell.checkDefaultBrowser", false);  // Nova lo ofrece en su bienvenida
  defaultPref("nova.animations.startup", true);
  defaultPref("nova.version", "0.1.0");

  // 3) Nueva pestaña de Nova
  try {
    const { AboutNewTab } = ChromeUtils.importESModule("resource:///modules/AboutNewTab.sys.mjs");
    AboutNewTab.newTabURL = "resource://nova/web/newtab.html";
  } catch (e) { Cu.reportError("Nova newtab: " + e); }

  // 4) Hoja de estilos de Nova en cada ventana del navegador
  const sss = Cc["@mozilla.org/content/style-sheet-service;1"].getService(Ci.nsIStyleSheetService);
  const uri = Services.io.newURI("resource://nova/web/nova.css");
  if (!sss.sheetRegistered(uri, sss.USER_SHEET)) sss.loadAndRegisterSheet(uri, sss.USER_SHEET);
} catch (e) {
  Components.utils.reportError("Nova cfg: " + e);
}
